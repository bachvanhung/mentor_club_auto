name: tra-loi-tu-dong

# AI tự trả lời bình luận + tin nhắn Fanpage, 15 phút/lần (GitHub có thể trễ vài phút).
on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [tra-loi-tu-dong]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Để trống = trả lời thật; --dry-run = chỉ xem AI soạn gì'
        required: false
        default: ''

concurrency:
  group: tra-loi-tu-dong
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - name: Trả lời bình luận + tin nhắn
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ vars.REEL_FB_PAGE_ID }}
          SO_BAI: ${{ vars.SO_BAI }}
          PRIVATE_REPLY: ${{ vars.PRIVATE_REPLY }}
          TRA_LOI_INBOX: ${{ vars.TRA_LOI_INBOX }}
        run: node scripts/tra-loi-tu-dong.js ${{ github.event.inputs.mode || github.event.client_payload.mode }}
