name: dang-reel

on:
  repository_dispatch:
    types: [dang-reel]
  workflow_dispatch:

concurrency:
  group: dang-reel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Đăng Reel
        env:
          TZ: Asia/Ho_Chi_Minh
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          LARK_APP_ID: ${{ github.event.client_payload.lark_app_id || vars.LARK_APP_ID }}
          LARK_APP_TOKEN: ${{ github.event.client_payload.base_token || vars.REEL_BASE_ID || vars.LARK_BASE_ID }}
          LARK_TABLE_ID: ${{ github.event.client_payload.table_id || vars.REEL_TABLE_ID }}
          FB_PAGE_ID: ${{ github.event.client_payload.fb_page_id || vars.REEL_FB_PAGE_ID }}
          RESPECT_SCHEDULE: ${{ github.event.client_payload.respect_schedule }}
          REEL_CHUNK_MB: ${{ github.event.client_payload.reel_chunk_mb }}
          MAX_POSTS: ${{ github.event.client_payload.max_posts }}
        run: node scripts/post-reels-api.js ${{ github.event.client_payload.mode }}
