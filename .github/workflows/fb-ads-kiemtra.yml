name: fb-ads-kiemtra

# CHỈ ĐỌC: kiểm tra token, tài khoản quảng cáo, Trang Mế Nguyệt, danh sách Reel, toạ độ.
# Không tạo / sửa / xoá gì trên Facebook.
on:
  push:
    branches: [ccr-f90d537d-5vj4eg]
    paths: ['.github/workflows/fb-ads-kiemtra.yml', 'scripts/fb-ads-kiemtra.js']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra (chỉ đọc)
        env:
          C_FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          C_FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          C_FB_TOKEN: ${{ secrets.FB_TOKEN }}
          C_FACEBOOK_TOKEN: ${{ secrets.FACEBOOK_TOKEN }}
          C_FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          C_FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          C_FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          C_PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          C_PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          C_USER_TOKEN: ${{ secrets.USER_TOKEN }}
          C_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          C_META_TOKEN: ${{ secrets.META_TOKEN }}
          C_META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          C_FB_ADS_TOKEN: ${{ secrets.FB_ADS_TOKEN }}
          C_ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
          C_TOKEN: ${{ secrets.TOKEN }}
          C_FB_LONG_TOKEN: ${{ secrets.FB_LONG_TOKEN }}
          C_FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          C_FB_PAGE_TOKEN_MENGUYET: ${{ secrets.FB_PAGE_TOKEN_MENGUYET }}
          C_MENGUYET_TOKEN: ${{ secrets.MENGUYET_TOKEN }}
          C_TOKEN_FB: ${{ secrets.TOKEN_FB }}
          C_TOKEN_PAGE: ${{ secrets.TOKEN_PAGE }}
          C_VAR_FB_USER_TOKEN: ${{ vars.FB_USER_TOKEN }}
          C_VAR_FB_PAGE_TOKEN: ${{ vars.FB_PAGE_TOKEN }}
          C_VAR_FB_TOKEN: ${{ vars.FB_TOKEN }}
          C_VAR_FACEBOOK_TOKEN: ${{ vars.FACEBOOK_TOKEN }}
          C_VAR_FB_ACCESS_TOKEN: ${{ vars.FB_ACCESS_TOKEN }}
          C_VAR_FB_PAGE_ACCESS_TOKEN: ${{ vars.FB_PAGE_ACCESS_TOKEN }}
          C_VAR_PAGE_TOKEN: ${{ vars.PAGE_TOKEN }}
          C_VAR_PAGE_ACCESS_TOKEN: ${{ vars.PAGE_ACCESS_TOKEN }}
          C_VAR_ACCESS_TOKEN: ${{ vars.ACCESS_TOKEN }}
          C_VAR_META_TOKEN: ${{ vars.META_TOKEN }}
          C_VAR_TOKEN: ${{ vars.TOKEN }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_HINT: 'nguyệt'
        run: node scripts/fb-ads-kiemtra.js
