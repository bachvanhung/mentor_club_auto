name: dang-youtube

on:
  repository_dispatch:
    types: [dang-youtube]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Đăng video lên YouTube
        env:
          LARK_APP_SECRET:  ${{ secrets.LARK_APP_SECRET }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          LARK_APP_ID:   ${{ github.event.client_payload.lark_app_id || vars.LARK_APP_ID }}
          LARK_APP_TOKEN: ${{ github.event.client_payload.base_token || vars.YT_BASE_ID || vars.LARK_BASE_ID }}
          LARK_TABLE_ID: ${{ github.event.client_payload.table_id || vars.TABLE_YOUTUBE }}
          YT_PRIVACY:    ${{ github.event.client_payload.privacy || vars.YT_PRIVACY }}
          YT_CATEGORY_ID: ${{ github.event.client_payload.category_id || vars.YT_CATEGORY_ID }}
          RESPECT_SCHEDULE: ${{ github.event.client_payload.respect_schedule }}
          RECORD_ID: ${{ github.event.client_payload.record_id }}
          YT_CHUNK_MB: ${{ github.event.client_payload.yt_chunk_mb }}
        run: node scripts/post-youtube-api.js ${{ github.event.client_payload.mode }}
